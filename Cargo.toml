[package]
name = "oui"
version = "0.1.0"
edition = "2021"
description = "terminal typing test that finds the keys and bigrams slowing you"

[[bin]]
name = "oui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
